{% load static %}
<header class="site-header">
  <div class="container">
    <div class="site-header__bar">
      <a class="brand" href="{% url 'store:home' %}">
        <img src="{% static 'img/logo.svg' %}" alt="" width="34" height="34">
        RecoMart
      </a>

      <form class="search-field" action="{% url 'store:product_list' %}" method="get" role="search">
        <label for="site-search" class="visually-hidden">Search products</label>
        <i class="bi bi-search" aria-hidden="true"></i>
        <input id="site-search" class="form-control" type="search" name="q" value="{{ request.GET.q }}"
               placeholder="Search phones, books, sneakers…" autocomplete="off">
      </form>

      <nav class="header-actions" aria-label="Account">
        {% if user.is_authenticated %}
          <div class="dropdown">
            <button class="icon-btn" type="button" data-bs-toggle="dropdown" aria-expanded="false">
              <i class="bi bi-person-circle" aria-hidden="true"></i>
              <span class="icon-btn__label">{{ user.first_name|default:user.username }}</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item" href="{% url 'accounts:profile' %}"><i class="bi bi-person me-2" aria-hidden="true"></i>Your profile</a></li>
              {% if user.is_store_admin %}
                <li><a class="dropdown-item" href="{% url 'admin:index' %}"><i class="bi bi-speedometer2 me-2" aria-hidden="true"></i>Admin panel</a></li>
              {% endif %}
              <li><hr class="dropdown-divider"></li>
              <li>
                <form method="post" action="{% url 'accounts:logout' %}">
                  {% csrf_token %}
                  <button class="dropdown-item" type="submit"><i class="bi bi-box-arrow-right me-2" aria-hidden="true"></i>Log out</button>
                </form>
              </li>
            </ul>
          </div>
        {% else %}
          <a class="icon-btn" href="{% url 'accounts:login' %}?next={{ request.path|urlencode }}">
            <i class="bi bi-person" aria-hidden="true"></i>
            <span class="icon-btn__label">Log in</span>
          </a>
        {% endif %}
      </nav>
    </div>
  </div>
</header>

<div class="category-strip">
  <div class="container">
    <nav class="category-nav" aria-label="Categories">
      <a href="{% url 'store:product_list' %}"{% if request.resolver_match.url_name == 'product_list' %} aria-current="page"{% endif %}>All products</a>
      {% for cat in nav_categories %}
        <a href="{{ cat.get_absolute_url }}"{% if request.resolver_match.kwargs.slug == cat.slug and request.resolver_match.url_name == 'category' %} aria-current="page"{% endif %}>
          <i class="bi bi-{{ cat.icon }}" aria-hidden="true"></i>{{ cat.name }}
        </a>
      {% endfor %}
    </nav>
  </div>
</div>
