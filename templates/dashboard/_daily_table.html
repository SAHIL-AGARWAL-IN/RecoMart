{% load store_tags %}
<details class="data-table"><summary>Show data table</summary>
  <div class="table-scroll" style="max-height: 260px; overflow-y: auto;">
    <table class="dash-table">
      <thead><tr><th>Date</th><th class="num">Orders</th><th class="num">Revenue</th></tr></thead>
      <tbody>{% for day in daily reversed %}<tr><td>{{ day.date }}</td><td class="num">{{ day.orders }}</td><td class="num">{{ day.revenue|inr }}</td></tr>{% endfor %}</tbody>
    </table>
  </div>
</details>
